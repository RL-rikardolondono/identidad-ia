.espacio{flex:1}

.ingreso{max-width:460px;margin:6px auto;width:100%}
h2.sub{font-size:24px;color:var(--azul)}

/* ================= el carnet ================= */
function qrSvg(texto) {
  try { const q = qrcode(0, 'M'); q.addData(texto); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return '<svg viewBox="0 0 10 10"><rect width="10" height="10" fill="#eee"/></svg>'; }
}
function carneFrente(p) {
  const e = emp(p.empresa); const st = estadoCarne(p);
  const foto = imgOk(p.foto) ? p.foto : avatar(p.nombre, e.c1);
  const lg = imgOk(e.logo) ? `<img src="${e.logo}" alt="">` : esc(e.nombre.split(/\s+/).map(x => x[0]).join('').slice(0, 3));
  return `<div class="carne ${st.ok ? '' : 'no'}" style="--c1:${e.c1};--c2:${e.c2}" role="img" aria-label="Carnet de ${esc(p.nombre)}">
    <div class="fondo"></div>
    <div class="cab"><div class="lg">${lg}</div><div><b>${esc(e.nombre)}</b><span>${esc(e.tipo)}${e.nit ? ' · NIT ' + esc(e.nit) : ''}</span></div></div>
    <img class="foto" src="${foto}" alt="">
    <div class="datos"><span class="rol">${esc(p.rol)}</span><span class="nom">${esc(p.nombre)}</span><span class="det">${esc(p.detalle)}</span><span class="vence">Vence: ${fmtF(p.vence)} · RH ${esc(p.rh || '—')}</span></div>
    <div class="qr">${qrSvg('https://' + URL_VERIF + p.token)}</div>
    <div class="pie"><span class="est">${st.ok ? '● VIGENTE' : '● ' + esc(st.motivo.toUpperCase())}</span><span>Verifique escaneando el QR</span></div>
    ${st.ok ? '' : `<div class="sello">${st.espera ? esc(st.motivo.toUpperCase()) : 'NO VIGENTE'}</div>`}
  </div>`;
}
function carneReverso(p) {
  const e = emp(p.empresa);
  return `<div class="carne reverso" style="--c1:${e.c1};--c2:${e.c2}" role="img" aria-label="Reverso del carnet">
    <div class="fondo"></div><div class="franja"></div>
    <div class="txt"><b>${esc(e.largo || e.nombre)}</b><span>${esc(e.reverso)}</span><span>Emergencia: ${esc(p.emergencia || '—')}</span><span>Código: ${esc(p.token.toUpperCase())}</span></div>

  </div>`;
}

const pillEstado = p => { const s = estadoCarne(p); return `<span class="pill ${s.ok ? 'p-ok' : (s.espera ? 'p-esp' : 'p-no')}">${esc(s.motivo)}</span>`; };

  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: tipo })); a.download = nombre; document.body.appendChild(a); a.click(); a.remove();

function leerCodigo(raw, modo) {
  modo = ['auto', 'entrada', 'salida'].includes(modo) ? modo : modoLectura();
  if (REAL()) return p_leerCodigo(raw, modo);
  const tk = String(raw || '').trim().toLowerCase().split(/[\/=]/).pop().replace(/[^a-z0-9]/g, '');
  const p = D.personas.find(x => x.token === tk && x.empresa === PERFIL.empresa); const e = emp(PERFIL.empresa); let j;
  if (!p) { D.accesos.unshift({ t: new Date().toISOString(), empresa: e.id, persona: '', ok: false, motivo: 'Carnet no encontrado', salida: modo === 'salida', quien: PERFIL.nombre }); j = { encontrado: false }; }
  else {
    const st = estadoCarne(p); const t0 = hoy() + 'T05:00:00';
    const ult = D.accesos.find(a => a.persona === p.id && a.ok && a.t >= t0);
    const salida = modo === 'auto' ? !!(ult && !ult.salida) : modo === 'salida';
    const persona = { id: p.id, nombre: p.nombre, rol: p.rol, detalle: p.detalle, foto: p.foto };
    if (st.ok && ult && Date.now() - Date.parse(ult.t) < 60e3 && (modo === 'auto' || ult.salida === salida)) j = { encontrado: true, ok: true, persona, salida: ult.salida, repetido: true };
    else { D.accesos.unshift({ t: new Date().toISOString(), empresa: e.id, persona: p.id, ok: st.ok, motivo: st.motivo, salida, quien: PERFIL.nombre }); j = { encontrado: true, ok: st.ok, motivo: st.motivo, persona, salida }; }
  }
  D.accesos = D.accesos.slice(0, 4000); guardar(); mostrarLectura(j);
}

const PROD = window.IDENTIDAD_PROD === true || /(^|\.)skynetgenesis\.com$/.test(location.hostname);
const API = window.IDENTIDAD_API || 'https://identidad-ia.onrender.com';
const REAL = () => !!(SESION && SESION.real);
let DEMO_D = null, YO = null, CLAVE_TOKEN = '', REG_PARA = '';
const ALM = { get: k => { try { return localStorage.getItem('identidadia_' + k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { v ? localStorage.setItem('identidadia_' + k, v) : localStorage.removeItem('identidadia_' + k); } catch (e) { } } };
async function api(metodo, ruta, cuerpo) {
  let r; const tk = ALM.get('tok');
  try { r = await fetch(API + ruta, { method: metodo, headers: { 'content-type': 'application/json', ...(tk ? { authorization: 'Bearer ' + tk } : {}) }, body: cuerpo ? JSON.stringify(cuerpo) : undefined }); }
  catch (e) { throw new Error('No hay conexión con el servidor. Revise su internet e intente de nuevo; si el servidor estaba dormido, tarda hasta un minuto en despertar.'); }
  let j = {}; try { j = await r.json(); } catch (e) { }
  if (r.status === 401 && REAL()) { salirReal('Su sesión terminó. Ingrese de nuevo.'); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Ocurrió un error. Intente de nuevo.'), { status: r.status });
  return j;
}
async function ocupado(b, fn) { if (b) { if (b.disabled) return; b.disabled = true; } try { return await fn(); } catch (e) { toast(e.message); } finally { if (b && b.isConnected) b.disabled = false; } }
function aplicarEstado(st) {
  const e = { ...st.empresa };
  D = { empresas: [e], personas: (st.personas || []).map(p => ({ ...p, empresa: e.id })), accesos: st.accesos || [], pedidos: (st.impresos || []).map(x => ({ ...x, empresa: e.id })), bitacora: st.bitacora || [],
    cuentas: (st.usuarios || []).map(u => ({ ...u, empresa: e.id, ultimo: u.ultimo ? Date.parse(u.ultimo) : 0, bloqueada: !!u.bloqueado })), claves: {}, registros: [], intentos: {} };
}
function aplicarResumen(r) {
  D = { empresas: r.empresas, personas: [], accesos: [], pedidos: r.impresos || [], bitacora: r.bitacora || [], pagos: r.pagos || [],
    cuentas: r.usuarios.map(u => ({ ...u, ultimo: u.ultimo ? Date.parse(u.ultimo) : 0, bloqueada: !!u.bloqueado })), claves: {}, registros: [], intentos: {} };
}
async function recargar() {
  if (YO && YO.perfil === 'super') aplicarResumen(await api('GET', '/api/sa/resumen')); else aplicarEstado(await api('GET', '/api/estado'));

function onSesion(j) {
  ALM.set('tok', j.token); YO = j.yo; ALM.set('yo', JSON.stringify(j.yo));
  if (!DEMO_D) DEMO_D = D;
  SESION = { real: true, correo: j.yo.correo };
  if (j.yo.perfil === 'super') PERFIL = PERFILES[0];
  else { PERFIL = { id: 'r-' + j.yo.id, nombre: j.yo.nombre + ' · ' + (j.estado ? j.estado.empresa.nombre : ''), tipo: j.yo.perfil === 'porteria' ? 'porteria' : 'admin', empresa: j.yo.empresa }; if (j.estado) aplicarEstado(j.estado); }

  if (j.yo.perfil === 'super') recargar().catch(e => toast(e.message)); else pintar();

function salirReal(msg) {
  const tk = ALM.get('tok'); if (tk && !msg) fetch(API + '/api/salir', { method: 'POST', headers: { authorization: 'Bearer ' + tk } }).catch(() => { });
  ALM.set('tok', ''); ALM.set('yo', ''); YO = null; cerrar();

}

function leerFoto(f, sal) {

  r.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); const s = Math.min(1, 1000 / Math.max(im.width, im.height)); c.width = im.width * s; c.height = im.height * s; const g = c.getContext('2d'); g.drawImage(im, 0, 0, c.width, c.height); const dat = g.getImageData(0, 0, c.width, c.height); const q = window.jsQR ? jsQR(dat.data, c.width, c.height) : null; if (q && q.data) leerCodigo(q.data, sal); else toast('No se encontró un QR en la foto. Acérquese más o escriba el código'); }; im.src = r.result; };
  r.readAsDataURL(f);
}
